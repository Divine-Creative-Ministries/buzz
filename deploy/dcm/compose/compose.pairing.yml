services:
  relay:
    environment:
      BUZZ_PAIRING_RELAY_URL: wss://buzz.divinecreative.org/pair

  pairing:
    image: ${BUZZ_IMAGE:-ghcr.io/block/buzz:main}
    entrypoint: ["/usr/local/bin/buzz-pair-relay"]
    environment:
      BUZZ_PAIR_RELAY_BIND_ADDR: 0.0.0.0:5000
    expose:
      - "5000"
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/5000'"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped
    networks:
      - buzz-net

  caddy:
    depends_on:
      pairing:
        condition: service_healthy
      relay:
        condition: service_healthy
    volumes:
      - /etc/buzz/Caddyfile:/etc/caddy/Caddyfile:ro
